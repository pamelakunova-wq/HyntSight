<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg" stroke="black" fill="none" stroke-width="1.5">
    <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,6 L9,3 z" fill="black" />
        </marker>
    </defs>

    <!-- Main Body Panel -->
    <g id="body-front-panel">
        <!-- Path defines the visible outline of the main body fabric. -->
        <!-- Starting at bottom-left, tracing up the side, armhole, shoulder, neck opening edge, other shoulder, armhole, side, bottom-right. -->
        <path d="M170 800 L150 420 C140 370 150 300 180 230 L355 220 Q400 230 445 220 L620 230 C650 300 660 370 650 420 L630 800 Z" />
    </g>

    <!-- Neckband Rib -->
    <g id="neckband">
        <!-- This path outlines the entire neckband piece, visible from the front -->
        <path d="M370 205 Q400 195 430 205 L445 220 Q400 230 355 220 Z" />
    </g>

    <!-- Left Sleeve -->
    <g id="left-sleeve">
        <!-- Path defines the visible outline of the left sleeve fabric -->
        <!-- Starts at shoulder, down the armhole, across the hem, and up the outer edge -->
        <path d="M180 230 C150 280 130 350 110 400 L110 480 L150 480 L150 420 Z" />
    </g>

    <!-- Right Sleeve (Mirrored for symmetry) -->
    <g id="right-sleeve">
        <!-- Path defines the visible outline of the right sleeve fabric -->
        <path d="M620 230 C650 280 670 350 690 400 L690 480 L650 480 L650 420 Z" />
    </g>

    <!-- Seam Lines (dashed for internal seams) -->
    <g id="seam-lines" stroke-dasharray="5 5">
        <!-- Shoulder seams (where body panel meets the neckband attachment area) -->
        <line x1="180" y1="230" x2="355" y2="220" /> <!-- Left shoulder -->
        <line x1="620" y1="230" x2="445" y2="220" /> <!-- Right shoulder -->
        <!-- Side seams of the body -->
        <line x1="150" y1="420" x2="170" y2="800" /> <!-- Left side seam -->
        <line x1="650" y1="420" x2="630" y2="800" /> <!-- Right side seam -->
        <!-- Underarm sleeve seams -->
        <line x1="150" y1="420" x2="150" y2="480" /> <!-- Left underarm sleeve seam -->
        <line x1="650" y1="420" x2="650" y2="480" /> <!-- Right underarm sleeve seam -->
        <!-- Neckband attachment seam (inner edge of rib, where it joins the body fabric) -->
        <path d="M355 220 Q400 230 445 220" />
    </g>

    <!-- Topstitching (solid lines, typically double-needle coverstitch) -->
    <g id="topstitching" stroke-width="1.2">
        <!-- Body Hem (two parallel lines for coverstitch) -->
        <path d="M170 795 H630" />
        <path d="M170 790 H630" />
        <!-- Left Sleeve Hem (two parallel lines for coverstitch) -->
        <path d="M110 475 H150" />
        <path d="M110 470 H150" />
        <!-- Right Sleeve Hem (two parallel lines for coverstitch) -->
        <path d="M690 475 H650" />
        <path d="M690 470 H650" />
        <!-- Neckband Topstitching (two parallel lines on the outer edge of the rib) -->
        <path d="M372 208 Q400 198 428 208" />
        <path d="M374 211 Q400 201 426 211" />
    </g>

    <!-- Measurements (annotations for key dimensions) -->
    <g id="measurements" font-size="12" fill="#666" stroke="none">
        <!-- Body Length Measurement -->
        <line x1="80" y1="195" x2="80" y2="800" stroke="#666" stroke-width="0.5" marker-start="url(#arrow)" marker-end="url(#arrow)" />
        <text x="90" y="500" dominant-baseline="middle" writing-mode="lr" transform="rotate(90 90 500)">Body Length</text>

        <!-- Chest Width Measurement -->
        <line x1="150" y1="850" x2="650" y2="850" stroke="#666" stroke-width="0.5" marker-start="url(#arrow)" marker-end="url(#arrow)" />
        <text x="400" y="865" text-anchor="middle">Chest Width</text>

        <!-- Sleeve Length Measurement (from shoulder point to outer sleeve hem) -->
        <line x1="180" y1="230" x2="110" y2="480" stroke="#666" stroke-width="0.5" marker-start="url(#arrow)" marker-end="url(#arrow)" />
        <text x="120" y="350" dominant-baseline="middle" writing-mode="lr" transform="rotate(-25 120 350)">Sleeve Length</text>

        <!-- Neck Drop Measurement (from top of neckband to deepest point of neck opening) -->
        <line x1="400" y1="195" x2="400" y2="230" stroke="#666" stroke-width="0.5" marker-start="url(#arrow)" marker-end="url(#arrow)" />
        <text x="410" y="212.5">Neck Drop</text>
    </g>
</svg>